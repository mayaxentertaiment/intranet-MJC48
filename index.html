<style>
:root{--bg:#dcd8ff;--c:#fff;--t:#16193b;--m:#8a8fb0;--p:#2f14f5;--pl:#edeaff;--s:#f6f5ff;--b:#e8eaf7;--r:18px}
*{box-sizing:border-box}
body{margin:0;font:14px 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;padding:20px}
button,select,input,textarea{font:inherit;padding:9px 12px;border:1px solid var(--b);border-radius:10px;background:#fff;color:inherit}
button{cursor:pointer;font-weight:600}button:hover{background:var(--s)}
button.p{background:var(--p);color:#fff;border-color:var(--p)}button.p:hover{background:#2308d8}button.d{color:#dc2626}
input,textarea,select{width:100%;margin:3px 0 9px}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;max-width:1440px;margin:0 auto;background:var(--c);border-radius:32px;overflow:hidden;min-height:calc(100vh - 40px);box-shadow:0 30px 60px -30px #2f14f566}

/* Hemat egress: update 1 baris dari payload realtime, bukan load() penuh. */
let _lt=null,_dirty=false;
function loadSoon(){if(document.hidden){_dirty=true;return}clearTimeout(_lt);_lt=setTimeout(load,1500)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&_dirty){_dirty=false;load()}});
function upsertRow(arr,row,del,cmp){const o=arr.filter(x=>x.id!==row.id);if(!del)o.push(row);return o.sort(cmp)}
function patchRT(table,p){
  const del=p.eventType==='DELETE',row=del?p.old:p.new;
  if(!row||!row.id)return loadSoon();
  if(document.hidden){_dirty=true;return}
  if(table==='jobs'){
    const del2=del||row.status==='dibatalkan';
    const all=upsertRow([...jobs,...pend],row,del2,(a,b)=>{const x=a.deadline,y=b.deadline;return x===y?0:!x?1:!y?-1:(x<y?-1:1)});
    jobs=all.filter(j=>!j.pending_approval);pend=all.filter(j=>j.pending_approval);
  }else if(table==='job_approvals'){
    appr=upsertRow(appr,row,del,(a,b)=>(b.created_at||'')<(a.created_at||'')?-1:1).slice(0,300);
  }else{
    dtasks=upsertRow(dtasks,row,del,(a,b)=>(b.created_at||'')<(a.created_at||'')?-1:1).slice(0,500);
  }
  render();
}

}
