<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intranet Staff MJC48</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9dbfb;--c:#fff;--t:#16193b;--m:#8a8fb0;--p:#4f63e8;--pl:#eef0ff;--s:#f5f6ff;--b:#e8eaf7;--r:18px}
*{box-sizing:border-box}
body{margin:0;font:14px 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;padding:20px}
button,select,input,textarea{font:inherit;padding:9px 12px;border:1px solid var(--b);border-radius:10px;background:#fff;color:inherit}
button{cursor:pointer;font-weight:600}button:hover{background:var(--s)}
button.p{background:var(--p);color:#fff;border-color:var(--p)}button.p:hover{background:#3f52d6}button.d{color:#dc2626}
input,textarea,select{width:100%;margin:3px 0 9px}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;max-width:1440px;margin:0 auto;background:var(--c);border-radius:32px;overflow:hidden;min-height:calc(100vh - 40px);box-shadow:0 30px 60px -30px #4f63e866}
.side{padding:26px 18px;display:flex;flex-direction:column;gap:4px}
.logo{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px;margin:0 8px 26px}
.logo i{width:28px;height:28px;border-radius:50%;background:var(--p);color:#fff;font-style:normal;display:grid;place-items:center;font-size:12px}
.nav{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--m);padding:11px 12px;border-radius:10px;position:relative}
.nav.on{background:var(--pl);color:var(--p)}.nav.on:after{content:"";position:absolute;right:-18px;top:8px;bottom:8px;width:4px;border-radius:4px 0 0 4px;background:var(--p)}
.nav.out{margin-top:auto}
.main{background:var(--s);padding:24px 26px;min-width:0}
.top{display:flex;gap:12px;align-items:center;margin-bottom:20px}.top input{margin:0;flex:1;border-radius:12px;border-color:transparent}
.hero{background:var(--p);color:#fff;border-radius:var(--r);padding:26px 28px;margin-bottom:22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-40px;width:230px;height:230px;border-radius:50%;background:#ffffff1f}
.hero:before{content:"";position:absolute;right:90px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:#ffffff14}
.hero h2{margin:0 0 6px;font-size:24px}.hero p{margin:0 0 16px;opacity:.9;max-width:380px;line-height:1.5}
.hero button{background:#fff;color:var(--p);border:0;position:relative;z-index:1}
h3.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stat{background:#fff;border:0;border-radius:14px;padding:14px;text-align:left;box-shadow:0 6px 18px -10px #4f63e855}
.stat b{display:block;font-size:26px;margin:6px 0 2px}.stat span{color:var(--m);font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tbl{background:#fff;border-radius:14px;padding:6px 14px;overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;min-width:520px}
.tbl th{color:var(--m);font-weight:500;font-size:12px;text-align:left;padding:12px 6px}
.tbl td{padding:12px 6px;border-top:1px solid var(--b)}.tbl tr.rw{cursor:pointer}.tbl tr.rw:hover td{background:var(--s)}
.late{color:#dc2626!important;font-weight:600}.empty{color:var(--m);padding:18px;text-align:center}
#board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#eceefb;border-radius:14px;padding:10px;min-height:140px}.col h4{margin:2px 4px 10px;font-size:13px}
.card{background:#fff;border-radius:12px;padding:11px;margin-bottom:9px;cursor:pointer;box-shadow:0 4px 12px -8px #4f63e8aa}
.card:hover{transform:translateY(-1px)}.card small{color:var(--m);display:block;margin-top:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pl);color:var(--p);margin-right:4px;font-weight:600}
.tag.urgent{background:#fee2e2;color:#b91c1c}.tag.tinggi{background:#ffedd5;color:#c2410c}
.pill{font-size:12px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{color:var(--m);font-size:12px;text-align:center;padding:4px}
.day{background:#fff;border-radius:10px;min-height:92px;padding:6px;font-size:12px;overflow:hidden}.day.td{outline:2px solid var(--p)}.day.o{opacity:.35}
.ev{display:block;width:100%;text-align:left;padding:2px 6px;margin-top:3px;border:0;border-radius:6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.right{padding:24px 22px;display:flex;flex-direction:column;gap:6px}
.me{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-bottom:14px;text-align:right}.me small{color:var(--m);display:block}
.av{width:38px;height:38px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0 14px}
.wd{background:var(--s);border-radius:10px;text-align:center;padding:8px 0;font-size:11px;color:var(--m)}.wd b{display:block;font-size:14px;color:var(--t);margin-top:3px}
.wd.on{background:var(--p);color:#fff}.wd.on b{color:#fff}.wd i{display:block;height:5px;margin-top:3px}.wd i:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#f59e0b}.wd.on i:before{background:#fff}
.panel{background:var(--s);border-radius:14px;padding:10px;display:grid;gap:4px}
.item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}.item:hover{background:#fff}.item div{min-width:0;flex:1}.item b,.item small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:var(--m)}
.bar{height:6px;background:var(--b);border-radius:6px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
dialog{border:0;border-radius:20px;width:min(560px,94vw);max-height:90vh;padding:22px;color:var(--t)}dialog::backdrop{background:#16193b88}
.box{max-width:360px;margin:12vh auto;background:var(--c);padding:26px;border-radius:20px}
.row{display:flex;gap:8px}.row>*{flex:1}.hist{border-left:3px solid var(--pl);padding-left:10px;margin:8px 0}
.hide{display:none!important}h4.s{margin:16px 0 4px}
@media(max-width:1100px){.shell{grid-template-columns:200px 1fr}.right{grid-column:1/-1;border-top:1px solid var(--b)}}
@media(max-width:720px){body{padding:0}.shell{grid-template-columns:1fr;border-radius:0}.side{flex-direction:row;overflow-x:auto;padding:12px}.logo,.nav.on:after{display:none}.nav{width:auto;white-space:nowrap}.nav.out{margin:0}.stats{grid-template-columns:repeat(2,1fr)}.main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<div id="auth" class="box hide"><h3>Masuk Intranet</h3>
<input id="em" type="email" placeholder="Email"><input id="pw1" type="password" placeholder="Password">
<button class="p" style="width:100%" onclick="login()">Masuk</button></div>
<div id="pw" class="box hide"><h3>Buat password</h3>
<input id="np" type="password" placeholder="Password baru (min. 6 karakter)">
<button class="p" style="width:100%" onclick="setPw()">Simpan password</button></div>
<div id="nope" class="box hide">Akunmu belum terdaftar sebagai staff. Hubungi admin.<br><br><button onclick="out()">Keluar</button></div>

<div id="app" class="shell hide">
 <aside class="side"><div class="logo"><i>M</i>MJC48</div>
  <button class="nav" data-v="dash" onclick="go('dash')">▦ Dashboard</button>
  <button class="nav" data-v="board" onclick="go('board')">☰ Papan kerja</button>
  <button class="nav" data-v="cal" onclick="go('cal')">▣ Kalender</button>
  <button id="bStaff" class="nav hide" onclick="staffUI()">☺ Kelola staff</button>
  <button class="nav out" onclick="out()">⎋ Keluar</button></aside>
 <main class="main"><div class="top"><input id="q" placeholder="Cari pekerjaan…" oninput="render()">
  <button id="bReq" class="p hide" onclick="$('dr').showModal()">+ Request baru</button></div>
  <div id="view"></div></main>
 <aside class="right" id="rp"></aside>
</div>

<dialog id="dj"></dialog><dialog id="ds"></dialog>
<dialog id="dr"><h3>Request baru</h3>
<input id="rj" placeholder="Judul">
<select id="rt"><option value="edit_foto">Edit foto</option><option value="edit_video">Edit video</option><option value="thumbnail">Thumbnail</option><option value="desain">Desain</option><option value="lainnya">Lainnya</option></select>
<textarea id="rd" rows="3" placeholder="Deskripsi / kebutuhan"></textarea>
<input id="rf" placeholder="Referensi (link)"><input id="ro" placeholder="Format output (mis. 1080x1920 MP4)">
<div class="row"><select id="rp2"><option>normal</option><option>rendah</option><option>tinggi</option><option>urgent</option></select><input id="rl" type="datetime-local"></div>
<div class="row"><button onclick="$('dr').close()">Batal</button><button class="p" onclick="kirimReq()">Kirim request</button></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://kkdmlotknjsxmifblewy.supabase.co', SB_KEY='sb_publishable_ki6C8vqsE--EFbHvjHMPbA_rEkmRKFs';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>/^https?:\/\//i.test(u||'')?esc(u):'#';
const ST={antrean:['Antrean','#8a8fb0'],dikerjakan:['Dikerjakan','#4f63e8'],review:['Review','#f59e0b'],revisi:['Revisi','#ef4444'],selesai:['Selesai','#22c9a6']};
const needPw=/type=(invite|recovery)/.test(location.hash);
let me=null,staff={},jobs=[],cur=null,sub=false,view='dash',calM=new Date();
const lead=()=>['admin','manager'].includes(me.staff_role);
const fmt=d=>d?new Date(d).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'-';
const late=j=>j.deadline&&j.status!=='selesai'&&new Date(j.deadline)<new Date();
const nm=id=>staff[id]?.nama||'Belum ditugaskan';
const toast=e=>alert(e.message||e);
const show=id=>['auth','pw','app','nope'].forEach(x=>$(x).classList.toggle('hide',x!==id));
const out=()=>sb.auth.signOut().then(()=>location.reload());
const sameDay=(a,b)=>new Date(a).toDateString()===b.toDateString();

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return show('auth');
  if(needPw)return show('pw');
  await loadStaff();
  me=staff[session.user.id];
  if(!me||me.aktif===false)return show('nope');
  $('bReq').classList.toggle('hide',me.staff_role==='editor');
  $('bStaff').classList.toggle('hide',me.staff_role!=='admin');
  show('app');await load();
  if(!sub){sub=true;sb.channel('jobs').on('postgres_changes',{event:'*',schema:'public',table:'jobs'},load).subscribe()}
}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw1').value});if(error)return toast(error);init()}
async function setPw(){const{error}=await sb.auth.updateUser({password:$('np').value});if(error)return toast(error);history.replaceState(null,'',location.pathname);location.reload()}
async function loadStaff(){const{data}=await sb.from('staff_profiles').select('*').order('nama');staff={};(data||[]).forEach(s=>staff[s.id]=s)}
async function load(){
  const{data,error}=await sb.from('jobs').select('*').neq('status','dibatalkan').order('deadline',{ascending:true,nullsFirst:false});
  if(error)return toast(error);jobs=data;render();
}
function go(v){view=v;render()}
function filt(){const q=($('q').value||'').toLowerCase();return q?jobs.filter(j=>(j.judul+' '+nm(j.assignee_id)).toLowerCase().includes(q)):jobs}

function render(){
  document.querySelectorAll('.nav[data-v]').forEach(n=>n.classList.toggle('on',n.dataset.v===view));
  $('view').innerHTML=view==='dash'?dash():view==='board'?board():cal();
  right();
}
function row(j){const[l,c]=ST[j.status];return `<tr class="rw" onclick="openJob('${j.id}')"><td><b>${esc(j.judul)}</b></td><td>${j.jenis.replace('_',' ')}</td><td>${esc(nm(j.assignee_id))}</td><td><span class="pill" style="color:${c}"><span class="dot" style="background:${c}"></span>${l}</span></td><td class="${late(j)?'late':''}">${fmt(j.deadline)}</td></tr>`}
function dash(){
  const h=new Date().getHours(),g=h<11?'pagi':h<15?'siang':h<18?'sore':'malam';
  const act=jobs.filter(j=>j.status!=='selesai'),mine=act.filter(j=>j.assignee_id===me.id),tl=act.filter(late);
  const L=filt().filter(j=>j.status!=='selesai').slice(0,8);
  return `<div class="hero"><h2>Selamat ${g}, ${esc(me.nama.split(' ')[0])}</h2>
  <p>${act.length} pekerjaan sedang berjalan, ${mine.length} ditugaskan kepadamu${tl.length?`, dan ${tl.length} sudah lewat deadline`:''}.</p>
  <button onclick="go('board')">Buka papan kerja</button></div>
  <h3 class="sec">Status pekerjaan</h3><div class="stats">${Object.entries(ST).map(([k,[l,c]])=>`<button class="stat" onclick="go('board')"><span><span class="dot" style="background:${c}"></span>${l}</span><b>${jobs.filter(j=>j.status===k).length}</b></button>`).join('')}</div>
  <h3 class="sec">Pekerjaan berjalan</h3><div class="tbl">${L.length?`<table><tr><th>Judul<th>Jenis<th>Penanggung jawab<th>Status<th>Deadline</tr>${L.map(row).join('')}</table>`:'<div class="empty">Belum ada pekerjaan. Buat request pertama lewat tombol di kanan atas.</div>'}</div>`;
}
function board(){
  return `<div id="board">${Object.entries(ST).map(([k,[l]])=>{
    let L=filt().filter(j=>j.status===k);
    if(k==='selesai')L=L.sort((a,b)=>new Date(b.selesai_at)-new Date(a.selesai_at)).slice(0,15);
    return `<div class="col"><h4>${l} (${L.length})</h4>${L.map(card).join('')}</div>`}).join('')}</div>`;
}
function card(j){return `<div class="card" onclick="openJob('${j.id}')"><span class="tag ${j.prioritas}">${j.prioritas}</span><span class="tag">${j.jenis.replace('_',' ')}</span>
  <div style="margin-top:6px"><b>${esc(j.judul)}</b></div><small>${esc(nm(j.assignee_id))}</small><small class="${late(j)?'late':''}">⏰ ${fmt(j.deadline)}</small></div>`}
function cal(){
  const y=calM.getFullYear(),m=calM.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),today=new Date();
  let cells=['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="h">${d}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=n;d++){const dt=new Date(y,m,d),ev=filt().filter(j=>j.deadline&&sameDay(j.deadline,dt));
    cells+=`<div class="day ${sameDay(dt,today)?'td':''}"><b>${d}</b>${ev.slice(0,3).map(j=>`<button class="ev" style="background:${ST[j.status][1]}" onclick="openJob('${j.id}')">${esc(j.judul)}</button>`).join('')}${ev.length>3?`<small>+${ev.length-3} lagi</small>`:''}</div>`}
  return `<h3 class="sec"><span>${calM.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</span><span class="row" style="flex:none"><button onclick="calM.setMonth(calM.getMonth()-1);render()">‹</button><button onclick="calM=new Date();render()">Hari ini</button><button onclick="calM.setMonth(calM.getMonth()+1);render()">›</button></span></h3><div class="cal">${cells}</div>`;
}
function right(){
  const t=new Date(),mon=new Date(t);mon.setDate(t.getDate()-((t.getDay()+6)%7));
  const wk=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);const has=jobs.some(j=>j.deadline&&j.status!=='selesai'&&sameDay(j.deadline,d));
    return `<div class="wd ${sameDay(d,t)?'on':''}">${d.toLocaleDateString('id-ID',{weekday:'short'})}<b>${d.getDate()}</b><i style="${has?'':'visibility:hidden'}"></i></div>`}).join('');
  const up=jobs.filter(j=>j.deadline&&j.status!=='selesai').slice(0,5);
  const eds=Object.values(staff).filter(s=>s.staff_role==='editor'&&s.aktif),act=jobs.filter(j=>['dikerjakan','revisi'].includes(j.status));
  const mx=Math.max(3,...eds.map(e=>act.filter(j=>j.assignee_id===e.id).length));
  $('rp').innerHTML=`<div class="me"><div><b>${esc(me.nama)}</b><small>${esc(me.staff_role)}</small></div><div class="av">${esc(me.nama[0]||'?')}</div></div>
  <b>Minggu ini</b><div class="week">${wk}</div>
  <b style="margin-top:4px">Deadline terdekat</b><div class="panel">${up.map(j=>`<div class="item" onclick="openJob('${j.id}')"><span class="dot" style="background:${ST[j.status][1]}"></span><div><b>${esc(j.judul)}</b><small class="${late(j)?'late':''}">${fmt(j.deadline)}</small></div></div>`).join('')||'<div class="empty">Tidak ada deadline.</div>'}</div>
  ${lead()?`<b style="margin-top:14px">Beban kerja editor</b><div class="panel">${eds.map(e=>{const c=act.filter(j=>j.assignee_id===e.id).length;return `<div class="item" style="cursor:default"><div><b>${esc(e.nama)}</b><small>${c} aktif</small><div class="bar"><i style="width:${c/mx*100}%"></i></div></div></div>`}).join('')||'<div class="empty">Belum ada editor aktif.</div>'}</div>`:''}`;
}

async function act(fn,args){if(await rpc(fn,args)){$('dj').close();load()}}
async function rpc(fn,args){const{error}=await sb.rpc(fn,args);if(error){toast(error);return false}return true}
async function openJob(id){
  cur=jobs.find(j=>j.id==id);const j=cur,mine=j.assignee_id===me.id;
  const[s,r,c]=await Promise.all([
    sb.from('job_submissions').select('*').eq('job_id',id).order('versi'),
    sb.from('job_reviews').select('*').eq('job_id',id),
    sb.from('job_comments').select('*').eq('job_id',id).order('created_at')]);
  const rev={};(r.data||[]).forEach(x=>rev[x.submission_id]=x);
  const eds=Object.values(staff).filter(x=>x.staff_role==='editor'&&x.aktif);
  let a='';
  if(me.staff_role==='editor'&&j.status==='antrean'&&(!j.assignee_id||mine))
    a+=`<button class="p" onclick="act('mulai_job',{p_job:'${id}'})">Mulai kerjakan</button>`;
  if(lead()&&['antrean','dikerjakan','revisi'].includes(j.status))
    a+=`<div class="row"><select id="asg">${eds.map(e=>`<option value="${e.id}" ${e.id===j.assignee_id?'selected':''}>${esc(e.nama)}</option>`).join('')}</select><button onclick="act('assign_job',{p_job:'${id}',p_assignee:$('asg').value})">Tugaskan</button></div>`;
  if(mine&&['dikerjakan','revisi'].includes(j.status))
    a+=`<input id="lnk" placeholder="Link hasil (Drive)"><input id="cat" placeholder="Catatan (opsional)"><button class="p" onclick="act('kirim_hasil',{p_job:'${id}',p_link:$('lnk').value,p_catatan:$('cat').value||null})">Kirim hasil</button>`;
  if(lead()&&j.status==='review')
    a+=`<input id="rc" placeholder="Catatan (wajib jika minta revisi)"><div class="row"><button class="p" onclick="act('review_job',{p_job:'${id}',p_keputusan:'setuju',p_catatan:$('rc').value||null})">Setujui</button><button onclick="act('review_job',{p_job:'${id}',p_keputusan:'revisi',p_catatan:$('rc').value})">Minta revisi</button></div>`;
  if(j.status!=='selesai'&&(lead()||(j.requester_id===me.id&&j.status==='antrean')))
    a+=`<button class="d" onclick="if(confirm('Batalkan job ini?'))act('batalkan_job',{p_job:'${id}'})">Batalkan job</button>`;
  const vers=(s.data||[]).map(v=>{const x=rev[v.id];return `<div class="hist"><b>v${v.versi}</b> <a href="${url(v.link_hasil)}" target="_blank" rel="noopener">buka hasil</a> ${esc(v.catatan||'')}${x?`<br><small>${x.keputusan==='setuju'?'✅ Disetujui':'🔁 Revisi'}: ${esc(x.catatan||'')} (${esc(staff[x.reviewer_id]?.nama)})</small>`:''}</div>`}).join('');
  const cms=(c.data||[]).map(x=>`<div class="hist"><small>${esc(staff[x.user_id]?.nama)}, ${fmt(x.created_at)}</small><br>${esc(x.isi)}</div>`).join('');
  $('dj').innerHTML=`<h3>${esc(j.judul)}</h3><p>${esc(j.deskripsi||'')}</p>
  <small>${j.jenis} | ${j.prioritas} | Deadline ${fmt(j.deadline)} | Format: ${esc(j.format_output||'-')}<br>
  Request dari ${esc(staff[j.requester_id]?.nama)}, ditugaskan ke ${esc(staff[j.assignee_id]?.nama||'-')}
  ${j.referensi_url?`<br><a href="${url(j.referensi_url)}" target="_blank" rel="noopener">Referensi</a>`:''}</small>
  <h4 class="s">Riwayat versi</h4>${vers||'<small>Belum ada hasil.</small>'}
  <h4 class="s">Aksi</h4>${a||'<small>Tidak ada aksi untukmu.</small>'}
  <h4 class="s">Komentar</h4>${cms}<div class="row"><input id="cm" placeholder="Tulis komentar"><button style="flex:0" onclick="komen()">Kirim</button></div>
  <button onclick="$('dj').close()">Tutup</button>`;
  if(!$('dj').open)$('dj').showModal();
}
async function komen(){
  const v=$('cm').value.trim();if(!v)return;
  const{error}=await sb.from('job_comments').insert({job_id:cur.id,isi:v});
  if(error)return toast(error);openJob(cur.id);
}
async function kirimReq(){
  const j=$('rj').value.trim();if(!j)return toast('Judul wajib diisi');
  const{error}=await sb.from('jobs').insert({judul:j,jenis:$('rt').value,deskripsi:$('rd').value||null,
    referensi_url:$('rf').value||null,format_output:$('ro').value||null,prioritas:$('rp2').value,
    deadline:$('rl').value?new Date($('rl').value).toISOString():null,requester_id:me.id});
  if(error)return toast(error);$('dr').close();load();
}

const ROLES=['admin','manager','editor','kreatif'];
async function staffUI(){
  await loadStaff();
  const rows=Object.values(staff).map(s=>`<tr><td>${esc(s.nama)}<br><small>${esc(s.divisi||'')}</small></td>
  <td><select onchange="upd('${s.id}',{staff_role:this.value})">${ROLES.map(r=>`<option ${r===s.staff_role?'selected':''}>${r}</option>`).join('')}</select></td>
  <td><label><input type="checkbox" style="width:auto" ${s.aktif?'checked':''} onchange="upd('${s.id}',{aktif:this.checked})"> aktif</label></td></tr>`).join('');
  $('ds').innerHTML=`<h3>Kelola staff</h3><table style="width:100%">${rows}</table>
  <h4 class="s">Undang staff baru (lewat email)</h4>
  <input id="sn" placeholder="Nama"><input id="se" type="email" placeholder="Email">
  <div class="row"><select id="sr">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select>
  <select id="sd"><option value="">- divisi -</option><option value="editor_foto">editor_foto</option><option value="editor_video">editor_video</option><option value="kreatif">kreatif</option></select></div>
  <div class="row"><button onclick="$('ds').close()">Tutup</button><button class="p" onclick="tambah()">Undang</button></div>`;
  if(!$('ds').open)$('ds').showModal();
}
async function upd(id,p){
  if(id===me.id&&(p.aktif===false||(p.staff_role&&p.staff_role!=='admin')))toast('Akunmu sendiri tidak bisa diubah di sini');
  else{const{error}=await sb.from('staff_profiles').update(p).eq('id',id);if(error)toast(error)}
  staffUI();
}
async function tambah(){
  const{data,error}=await sb.functions.invoke('buat-staff',{body:{nama:$('sn').value.trim(),email:$('se').value.trim(),
    staff_role:$('sr').value,divisi:$('sd').value,redirectTo:location.origin+location.pathname}});
  if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch{}return toast(m)}
  toast('Undangan terkirim ke '+$('se').value);staffUI();
}
init();
</script></body></html>
